<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- Ground shadow -->
  <ellipse cx="100" cy="180" rx="46" ry="8" fill="#E8DFF2" />
  
  <!-- Feet resting quietly -->
  <rect x="74" y="162" width="18" height="16" rx="8" fill="#8E72C9" />
  <rect x="108" y="162" width="18" height="16" rx="8" fill="#8E72C9" />

  <!-- Body (Squishy relaxed cozy shape) -->
  <rect x="52" y="60" width="96" height="110" rx="48" fill="#B8A1E3" />

  <!-- Belly patch -->
  <ellipse cx="100" cy="128" rx="32" ry="32" fill="#EDE5FA" />

  <!-- Head sprout tilted slightly drooping softly -->
  <path d="M100 60 C98 50 102 44 109 46 C114 47 113 54 103 56" stroke="#8E72C9" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <circle cx="110" cy="46" r="4.5" fill="#F6D6B8" />

  <!-- Arms resting gently across tummy -->
  <path d="M54 116 C60 128 72 134 84 130 C90 128 90 120 82 118" fill="#8E72C9" />
  <path d="M146 116 C140 128 128 134 116 130 C110 128 110 120 118 118" fill="#8E72C9" />

  <!-- Soft pastel rosy sleepy cheeks -->
  <ellipse cx="74" cy="106" rx="8" ry="5" fill="#F5C6D6" opacity="0.9" />
  <ellipse cx="126" cy="106" rx="8" ry="5" fill="#F5C6D6" opacity="0.9" />

  <!-- Sleepy closed crescent eyes with little gentle eyelashes -->
  <path d="M74 98 Q80 104 86 98" stroke="#342B43" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <line x1="84" y1="102" x2="87" y2="105" stroke="#342B43" stroke-width="2" stroke-linecap="round" />

  <path d="M114 98 Q120 104 126 98" stroke="#342B43" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <line x1="124" y1="102" x2="127" y2="105" stroke="#342B43" stroke-width="2" stroke-linecap="round" />

  <!-- Soft cozy breathing mouth (tiny 'o' or gentle relaxed smile) -->
  <ellipse cx="100" cy="107" rx="3" ry="3.5" fill="#342B43" />

  <!-- Gentle little floating Zzz in soft pastel pink -->
  <text x="145" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#F5C6D6" opacity="0.9">Z</text>
  <text x="156" y="52" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F5C6D6" opacity="0.8">z</text>
  <text x="164" y="42" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#F5C6D6" opacity="0.7">z</text>
</svg>
