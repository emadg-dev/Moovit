<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- Calm wide ground shadow -->
  <ellipse cx="100" cy="180" rx="48" ry="8" fill="#E8DFF2" />
  
  <!-- Sitting crossed feet -->
  <rect x="70" y="160" width="22" height="15" rx="7.5" fill="#8E72C9" transform="rotate(-8 81 167)" />
  <rect x="108" y="160" width="22" height="15" rx="7.5" fill="#8E72C9" transform="rotate(8 119 167)" />

  <!-- Body (Comfortably settled rounded shape) -->
  <rect x="54" y="58" width="92" height="112" rx="46" fill="#B8A1E3" />
  <ellipse cx="100" cy="126" rx="30" ry="33" fill="#EDE5FA" />

  <!-- Head sprout calm curl -->
  <path d="M100 58 C99 46 106 38 113 40 C117 41 116 50 104 53" stroke="#8E72C9" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <circle cx="114" cy="40" r="5" fill="#F6D6B8" />

  <!-- Arms resting calmly on lap -->
  <path d="M56 112 C64 124 76 130 90 128 C96 127 96 118 88 118" fill="#8E72C9" />
  <path d="M144 112 C136 124 124 130 110 128 C104 127 104 118 112 118" fill="#8E72C9" />

  <!-- Soft blushing cheeks -->
  <ellipse cx="76" cy="102" rx="7.5" ry="4.5" fill="#F5C6D6" opacity="0.9" />
  <ellipse cx="124" cy="102" rx="7.5" ry="4.5" fill="#F5C6D6" opacity="0.9" />

  <!-- Calm relaxed peaceful eyes (sweet gentle curve) -->
  <path d="M78 94 Q83 90 88 94" stroke="#342B43" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M112 94 Q117 90 122 94" stroke="#342B43" stroke-width="2.8" stroke-linecap="round" fill="none" />

  <!-- Gentle contented small smile -->
  <path d="M95 104 Q100 108 105 104" stroke="#342B43" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Little floating calm tea or relaxation sparkle -->
  <circle cx="148" cy="80" r="3" fill="#B9DDCA" />
  <path d="M152 70 Q156 64 154 58" stroke="#B8A1E3" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
